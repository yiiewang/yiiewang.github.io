# ---------------------------------------------------------------------------
# Project
# ---------------------------------------------------------------------------
site_name: Cloaks｜Yiiewang
site_url: https://cloaks.cn
site_author: Cloaks｜Yiiewang
site_description: >-
  Cloaks｜Yiiewang 的个人站点 —— 博客记录思考过程，知识库沉淀能力体系。涵盖技术、工程实践、思维方法、领域知识、人文素养、工具效率和职业发展七大能力域。欢迎浏览、搜索和留言讨论。

