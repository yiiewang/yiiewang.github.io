#
# - 唯一配置源；构建入口见 Makefile / .github/workflows/ci.yml
# - 镜像版本唯一定义在 .github/workflows/Dockerfile
# - 博客文章列表由 scripts/blog_macros.py 的 blog_list() 宏渲染（plugins.macros）
