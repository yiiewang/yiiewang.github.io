# Theme
# ---------------------------------------------------------------------------
[project.theme]
custom_dir = "overrides"
favicon = "assets/favicon.ico"
language = "zh"
logo = "assets/favicon.ico"
name = "material"
variant = "modern"

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.line_numbers",
  "content.code.select",
  "content.footnote.back",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.preview",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.quick",
  "search.share",
  "search.suggest",
  "toc.follow", # 关闭：底部「上一页/下一页」导航  # "navigation.footer",  # 关闭：避免每个目录旁显示 ⓘ 图标，子目录已有「概览」项  # "navigation.indexes",  # "toc.integrate",
]

[project.theme.font]
code = "Roboto Mono"
text = "Roboto"

[project.theme.icon]
annotation = "material/plus-circle"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/link"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
accent = "indigo"
media = "(prefers-color-scheme: light)"
primary = "indigo"
scheme = "default"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "indigo"
media = "(prefers-color-scheme: dark)"
primary = "black"
scheme = "slate"
toggle.icon = "material/toggle-switch-off"
toggle.name = "Switch to system preference"

# ---------------------------------------------------------------------------
# Markdown extensions (built-in + pymdownx)
#
# 说明：Zensical 只接受字符串形式的可调用对象路径，不接受 YAML 的
# !!python/name: / !!python/object/apply: 标签，因此这里统一写成模块路径。
# ---------------------------------------------------------------------------
[project.markdown_extensions]
# built-in
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {}
# pymdownx
pymdownx.arithmatex.generic = true
pymdownx.betterem.smart_enable = "all"
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
# repo / user 是 magiclink 的仓库简写（指向上游 squidfunk/mkdocs-material），
# 与本项目的构建工具无关，保持原值
pymdownx.magiclink.normalize_issue_symbols = true
pymdownx.magiclink.repo = "mkdocs-material"
pymdownx.magiclink.repo_url_shorthand = true
pymdownx.magiclink.user = "squidfunk"
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  {name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format"},
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tabbed.slugify = {object = "pymdownx.slugs.slugify", kwds = {case = "lower"}}
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# ---------------------------------------------------------------------------
# Plugins
#
# Zensical 未支持的插件（blog / rss / social / privacy / optimize）不再列出，
# 对应功能现状：
#   blog     → 文章列表改由 scripts/blog_macros.py 的 blog_list() 宏渲染
#   rss      → feed_rss_created.xml 不再生成（页脚/首页的 RSS 链接已隐藏）
#   social   → 不再生成社交分享卡片（OG 图）
#   privacy  → 外部 CDN 资源（mermaid/katex）不再本地化
#   optimize → 不再压缩图片、不生成 srcset 响应式变体
# 兼容列表：https://zensical.org/docs/compatibility/mkdocs/plugins/
# ---------------------------------------------------------------------------
[project.plugins.macros]
# 白名单模式：只有显式声明 render_macros: true 的页面（如 docs/blog/index.md）
# 才走 Jinja 渲染，避免代码块中的 {{ }} 被误渲染
render_by_default = false
# 宏执行出错时直接中止构建（而不是吞掉异常渲染原文）。
# blog_macros 用它实现「未收录分类」硬门禁：本地/CI 构建失败即拦截部署。
on_error_fail = true
# module_name 默认是 "main"（即项目根目录 main.py），这里指向 scripts/blog_macros.py
module_name = "scripts/blog_macros"

[project.plugins.glightbox]

[project.plugins.meta]

[project.plugins.search]
separator = '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

[project.plugins.tags]
tags_slugify = {object = "pymdownx.slugs.slugify", kwds = {case = "lower"}}
tags_slugify_separator = "_"

[project.plugins.minify]
minify_html = true

