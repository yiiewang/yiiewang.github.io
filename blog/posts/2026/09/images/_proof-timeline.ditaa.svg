ext x="412" y="81" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[X 创建]]></text><text x="126" y="96" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[P 早于 X 入队：createdAt_P ≤ createdAt_X]]></text><text x="129" y="110" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[同一 TTL：expireAt_P ≤ expireAt_X]]></text><text x="453" y="110" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[te]]></text><text x="631" y="82" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[X 过期(te)]]></text><text x="765" y="82" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[tick]]></text><text x="20" y="137" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[反证假设：tk 这轮结束时 X 仍在队列 → 有东西挡在 X 前面]]></text><text x="20" y="151" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[唯一能挡路的形态：pending 里的 P（持有策略保证其余都已出队）]]></text><text x="20" y="165" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[但 P 在队列里排在 X 前面（P1）且过期不晚于 te（P2）]]></text><text x="20" y="180" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[expireAt_P ≤ te]]></text><text x="204" y="180" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[tk → tk 轮开始前 P 已过期 → 该轮必然清掉/释放 P]]></text><text x="20" y="193" font-family="sans-serif" font-size="13" stroke="none" fill="#ffffff"><![CDATA[矛盾！所以 X 要么 tk 轮被清，要么成为新的 pending]]></text><text x="20" y="207" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[成为 pending 的 X：下一轮就是全队列最老的元素，同样必被清]]></text><text x="26" y="235" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[结论：清理延迟 ≤ 一个 tick（Δ）]]></text><text x="58" y="264" font-family="sans-serif" font-size="13" stroke="none" fill="#000000"><![CDATA[t_clean ∈ [te, te+Δ]]]></text></g></svg>