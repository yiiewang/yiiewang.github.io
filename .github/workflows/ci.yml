name: ci
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: cloaks/zensical:0.0.60
    steps:
      - uses: actions/checkout@v4

      # 从 Dockerfile 构建镜像：与本地 make dev/build/preview 完全一致，
      # 且 Zensical 版本只在 Dockerfile 中定义（单一来源）。
      - name: Build Zensical image
        run: docker build -t "$DOCKER_IMAGE" -f .github/workflows/Dockerfile .

      # --user 让容器以 runner 用户身份运行：否则 site/ 归 root 所有，
      # 下一步的 touch 会因权限不足失败（touch: Permission denied）。
      - name: Build site
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/docs "$DOCKER_IMAGE" build -f mkdocs.yml --clean
          touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
