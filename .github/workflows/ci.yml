name: ci
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_REPO: cloaks/zensical
    steps:
      - uses: actions/checkout@v4

      # 镜像 tag 由 Dockerfile 中的固定版本推导（全仓唯一版本源），
      # 避免改了 Dockerfile 却忘了同步这里的 tag。
      - name: Resolve image tag from Dockerfile
        run: |
          pinned=$(grep -oE "zensical==[0-9.]+" .github/workflows/Dockerfile | head -1 | cut -d= -f3)
          if [ -z "$pinned" ]; then
            echo "::error::无法从 .github/workflows/Dockerfile 解析 zensical 固定版本"
            exit 1
          fi
          echo "DOCKER_IMAGE=$DOCKER_REPO:$pinned" >> "$GITHUB_ENV"
          echo ">>> 镜像: $DOCKER_REPO:$pinned"

      # 镜像由本地 `make docker-build` 构建后推送到 Docker Hub，CI 只拉取不构建。
      - name: Pull Zensical image
        run: docker pull "$DOCKER_IMAGE"

      # 防漂移：镜像内的 zensical 版本必须与 Dockerfile 固定版本一致，
      # 否则说明 Dockerfile 改了但镜像没重新推送，构建结果会与仓库不一致。
      - name: Verify image version matches Dockerfile
        run: |
          pinned=$(sed -n 's/.*"zensical==\([0-9][0-9.]*\)".*/\1/p' .github/workflows/Dockerfile | head -1)
          actual=$(docker run --rm --entrypoint zensical "$DOCKER_IMAGE" --version | tr -d '[:space:]')
          echo "Dockerfile 固定版本: $pinned / 镜像内版本: $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::镜像版本 ($actual) 与 Dockerfile ($pinned) 不一致。请执行 make docker-build 后推送镜像。"
            exit 1
          fi

      # --user 让容器以 runner 用户身份运行：否则 site/ 归 root 所有，
      # 下一步的 touch 会因权限不足失败（touch: Permission denied）。
      # SEO 产物（llms.txt / llms-full.txt / rss.xml）构建前生成进 docs/，
      # 随站点发布；不入库（见 .gitignore），保证永远与内容同步。
      - name: Generate SEO files
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/docs \
            --entrypoint python3 "$DOCKER_IMAGE" scripts/gen_seo.py

      - name: Build site
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/docs "$DOCKER_IMAGE" build -f zensical.toml --clean
          touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.event.head_commit.message }}"

      # IndexNow 主动推送（Bing / Yandex / Naver / Seznam 即时索引；
      # Google 不支持此协议，收录走 Search Console 的 sitemap）。
      # key 即公开文件 docs/<key>.txt（协议约定：key 命名、站点根目录可访问）。
      # 推送失败不阻塞部署。
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 64a30b4ea9a3b4788dc0e6a70faf239c
        run: |
          curl -fsS --max-time 20 \
            "https://api.indexnow.org/indexnow?url=https%3A%2F%2Fcloaks.cn%2F&key=${INDEXNOW_KEY}"
